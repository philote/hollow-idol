[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hollow-idol"
version = "0.1.0"
description = "Parametric mold case generator for ceramic slip casting"
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hollow_idol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
